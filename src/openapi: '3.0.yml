openapi: '3.0.3'
info:
  title: movieGoer API
  description: An IMDb clone REST API built with Fastify, Sequelize, and PostgreSQL.
  version: '1.0'
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: User registration, login, and profile operations
  - name: Titles
    description: Movies, TV shows, and ratings
  - name: People
    description: Actors, directors, and writers
  - name: Watchlist
    description: Authenticated user watchlists

paths:
  # ================= AUTH ROUTES =================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Missing required fields
        '409':
          description: Email already in use

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current logged-in user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized / Invalid Token

  # ================= TITLE ROUTES =================
  /titles/search:
    get:
      tags: [Titles]
      summary: Search for movies by title
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: The search term (e.g., "Batman")
      responses:
        '200':
          description: A list of matching movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Title'

  /titles/top-rated:
    get:
      tags: [Titles]
      summary: Get the highest-rated movies
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: A list of top-rated movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Title'

  /titles/{id}:
    get:
      tags: [Titles]
      summary: Get full movie details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The tconst ID of the title
      responses:
        '200':
          description: Movie details including ratings and cast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Title'
        '404':
          description: Title not found

  # ================= PEOPLE ROUTES =================
  /people/search:
    get:
      tags: [People]
      summary: Search for an actor or director
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of matching people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Person'

  /people/{id}:
    get:
      tags: [People]
      summary: Get a person's profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Person details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'

  /people/{id}/credits:
    get:
      tags: [People]
      summary: Get a list of movies this person worked on
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of titles associated with the person
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Title'

  # ================= WATCHLIST ROUTES =================
  /watchlist:
    get:
      tags: [Watchlist]
      summary: Get logged-in user's watchlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of saved movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Title'
        '401':
          description: Unauthorized

  /watchlist/{titleId}:
    post:
      tags: [Watchlist]
      summary: Add a movie to the watchlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: titleId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Movie added to watchlist
        '401':
          description: Unauthorized
    
    delete:
      tags: [Watchlist]
      summary: Remove a movie from the watchlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: titleId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movie removed from watchlist
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    Title:
      type: object
      properties:
        tconst:
          type: string
        titleType:
          type: string
        primaryTitle:
          type: string
        originalTitle:
          type: string
        startYear:
          type: string
        runtimeMinutes:
          type: string
        genres:
          type: string
        Rating:
          $ref: '#/components/schemas/Rating'

    Person:
      type: object
      properties:
        nconst:
          type: string
        primaryName:
          type: string
        birthYear:
          type: string
        deathYear:
          type: string
        primaryProfession:
          type: string

    Rating:
      type: object
      properties:
        averageRating:
          type: number
          format: float
        numVotes:
          type: integer