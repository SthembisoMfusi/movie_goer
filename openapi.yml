openapi: 3.0.3
info:
  title: movieGoer API
  description: >
    An enterprise-grade REST API for an IMDb clone.
    Built with Fastify, Sequelize (auth/watchlist only), and the TMDB API
    for titles and people. Features rate-limiting and JWT authentication.
  version: "2.0.0"
  contact:
    name: API Support
servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
    description: User registration, login, and secure profile management
  - name: Titles
    description: Search and retrieve movies via TMDB
  - name: People
    description: Lookup actors, directors, writers via TMDB
  - name: Watchlist
    description: Manage authenticated users' saved movies (TMDB IDs)

paths:
  # ================= AUTH ROUTES =================
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account and securely hashes the password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  userId:
                    type: integer
                    example: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Email is already in use"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT
      description: Authenticates user credentials and returns a secure JSON Web Token valid for 7 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5c..."
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid email or password"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current logged-in user profile
      description: Validates the Bearer token and returns the user's details (excluding password).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ================= TITLE ROUTES (TMDB-backed) =================
  /titles/search:
    get:
      tags: [Titles]
      summary: Search for movies by title
      description: Proxies TMDB's /search/movie endpoint.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: TMDB's paginated movie search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmdbMovieSearchResponse'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /titles/{id}:
    get:
      tags: [Titles]
      summary: Get a movie by TMDB ID
      description: Fetches full movie details from TMDB, including credits.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "278"
          description: The numeric TMDB movie ID
      responses:
        '200':
          description: The requested movie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmdbMovieDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /titles/top-rated:
    get:
      tags: [Titles]
      summary: Get TMDB's top-rated movies
      parameters:
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: TMDB's paginated top-rated movie list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmdbMovieSearchResponse'
        '502':
          $ref: '#/components/responses/UpstreamError'

  # ================= PEOPLE ROUTES (TMDB-backed) =================
  /people/search:
    get:
      tags: [People]
      summary: Search for an actor/director by name
      description: Proxies TMDB's /search/person endpoint.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/PageQuery'
      responses:
        '200':
          description: TMDB's paginated person search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmdbPersonSearchResponse'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /people/{id}:
    get:
      tags: [People]
      summary: Get a person's profile by TMDB ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "192"
      responses:
        '200':
          description: The requested person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TmdbPersonDetails'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /people/{id}/credits:
    get:
      tags: [People]
      summary: Get a person's profile and full movie credits
      description: Fetches a person's TMDB profile plus their TMDB movie credits (cast + crew).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: "192"
      responses:
        '200':
          description: The requested person and their movie credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  person:
                    $ref: '#/components/schemas/TmdbPersonDetails'
                  credits:
                    $ref: '#/components/schemas/TmdbPersonMovieCredits'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/UpstreamError'

  # ================= WATCHLIST ROUTES =================
  /watchlist:
    get:
      tags: [Watchlist]
      summary: Get logged-in user's watchlist
      description: Fetches the user's saved TMDB movie IDs, hydrated with live TMDB movie data.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of saved movies
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  watchlist:
                    type: array
                    items:
                      $ref: '#/components/schemas/TmdbMovieDetails'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /watchlist/{titleId}:
    post:
      tags: [Watchlist]
      summary: Add a movie to the watchlist
      description: titleId must be a valid TMDB movie ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: titleId
          required: true
          schema:
            type: string
            example: "278"
      responses:
        '201':
          description: Movie added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: "Added to watchlist"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Movie not found on TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Movie not found on TMDB"
        '409':
          description: Movie already exists in watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Movie is already in your watchlist"

    delete:
      tags: [Watchlist]
      summary: Remove a movie from the watchlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: titleId
          required: true
          schema:
            type: string
            example: "278"
      responses:
        '200':
          description: Movie removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: "Removed from watchlist"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Movie not in watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Movie not found in your watchlist"


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Enter your JWT token in the format: Bearer <token>"

  parameters:
    SearchQuery:
      in: query
      name: q
      required: true
      schema:
        type: string
      description: The search term (e.g., "Batman" or "Morgan Freeman")
    PageQuery:
      in: query
      name: page
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination (TMDB fixes 20 results per page)

  responses:
    UnauthorizedError:
      description: Missing or invalid Bearer Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Unauthorized: Invalid or missing token"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Not found"
    BadRequestError:
      description: Malformed request or missing parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Bad Request"
            message: "body/password must NOT have fewer than 6 characters"
    UpstreamError:
      description: TMDB request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "TMDB request failed"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          description: Detailed validation error (if provided by Fastify)

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "securepassword123"
          minLength: 6

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "securepassword123"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john@example.com"

    TmdbMovieSummary:
      type: object
      description: A single movie as returned by TMDB search/list endpoints.
      properties:
        id:
          type: integer
          example: 278
        title:
          type: string
          example: "The Shawshank Redemption"
        original_title:
          type: string
        overview:
          type: string
        release_date:
          type: string
          example: "1994-09-23"
        poster_path:
          type: string
          nullable: true
        backdrop_path:
          type: string
          nullable: true
        genre_ids:
          type: array
          items:
            type: integer
        vote_average:
          type: number
          format: float
          example: 8.7
        vote_count:
          type: integer
        popularity:
          type: number
        adult:
          type: boolean
        original_language:
          type: string

    TmdbMovieSearchResponse:
      type: object
      properties:
        page:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/TmdbMovieSummary'
        total_pages:
          type: integer
        total_results:
          type: integer

    TmdbMovieDetails:
      allOf:
        - $ref: '#/components/schemas/TmdbMovieSummary'
        - type: object
          properties:
            runtime:
              type: integer
              nullable: true
            status:
              type: string
            tagline:
              type: string
              nullable: true
            budget:
              type: integer
            revenue:
              type: integer
            genres:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
            credits:
              type: object
              properties:
                cast:
                  type: array
                  items:
                    $ref: '#/components/schemas/TmdbCastMember'
                crew:
                  type: array
                  items:
                    $ref: '#/components/schemas/TmdbCrewMember'

    TmdbCastMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        character:
          type: string
        profile_path:
          type: string
          nullable: true
        order:
          type: integer

    TmdbCrewMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        job:
          type: string
        department:
          type: string
        profile_path:
          type: string
          nullable: true

    TmdbPersonSummary:
      type: object
      properties:
        id:
          type: integer
          example: 192
        name:
          type: string
          example: "Morgan Freeman"
        profile_path:
          type: string
          nullable: true
        known_for_department:
          type: string
          example: "Acting"
        popularity:
          type: number

    TmdbPersonSearchResponse:
      type: object
      properties:
        page:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/TmdbPersonSummary'
        total_pages:
          type: integer
        total_results:
          type: integer

    TmdbPersonDetails:
      allOf:
        - $ref: '#/components/schemas/TmdbPersonSummary'
        - type: object
          properties:
            biography:
              type: string
            birthday:
              type: string
              nullable: true
            deathday:
              type: string
              nullable: true
            place_of_birth:
              type: string
              nullable: true

    TmdbPersonMovieCredits:
      type: object
      properties:
        id:
          type: integer
        cast:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/TmdbMovieSummary'
              - type: object
                properties:
                  character:
                    type: string
        crew:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/TmdbMovieSummary'
              - type: object
                properties:
                  job:
                    type: string
                  department:
                    type: string